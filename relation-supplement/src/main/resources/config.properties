# ===== Neo4j 配置 =====
neo4j.uri=bolt://172.17.43.137:7687
neo4j.user=neo4j
neo4j.password=neo4j123

# ===== 路径可达 guard =====
# 仅当成员与户主在图谱中「不可达」时才补充建边；已可达则跳过
guard.enabled=true
# 可达判定深度上限（1..8），范围外会被裁剪
guard.max_depth=8
# 判定时忽略本工具既往补充的边（origin=supplement），保证可重复运行且结果稳定
guard.ignore_supplement_edges=true
