# 徐州数据治理应用平台 —— 单 jar 前后端一体化部署
# 用法：docker compose up -d --build
# 说明：
#   1. 应用为单个可执行 jar（前端已打包进 ruoyi-admin.jar），暴露 8080 端口
#   2. MySQL 自动导入若依系统表 ry_vue_5.X.sql（登录账号 admin / admin123）
#   3. Neo4j 为全新空库，图谱数据需用 mysql-neo4j-importer 重新导入
#   4. 密码等配置直接写在下方，请按需修改

services:
  app:
    build:
      context: ./ruoyi-web/ruoyi-admin
      dockerfile: Dockerfile
    container_name: hukou-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MySQL（dynamic-datasource 主库）
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: "jdbc:mysql://mysql:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: root
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Bishenglu@339
      SPRING_DATA_REDIS_DATABASE: 1
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: neo4j123
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: hukou-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ry-vue
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ruoyi-web/script/sql/ry_vue_5.X.sql:/docker-entrypoint-initdb.d/01-ry-vue.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: hukou-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "Bishenglu@339", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  neo4j:
    image: neo4j:5-community
    container_name: hukou-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  mysql-data:
  redis-data:
  neo4j-data:
