# ===== MySQL / StarRocks 配置 =====
mysql.url=jdbc:mysql://172.17.43.25:3308/hukou?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
mysql.user=root
mysql.password=root
mysql.table=zl_szf_sga_zxk_smzj_hy_hydjxx
# 源库查询超时（秒）。StarRocks 默认 300 秒，大批量读取需调大；0 表示不设置
mysql.query_timeout_seconds=86400

# ===== Neo4j 配置 =====
neo4j.uri=bolt://172.17.43.137:7687
neo4j.user=neo4j
neo4j.password=neo4j123

# ===== 婚姻状态 -> 关系类型 =====
# 婚姻状态字典：IA=已婚，IB=离异，ICA=结婚待领证，ICB=离婚待领证
# 默认只处理已生效的 IA / IB；如需包含待领证状态，追加到列表中（英文逗号分隔）
hydj.spouse_statuses=IA
hydj.divorce_statuses=IB

# 写入 Neo4j 的关系类型名（需为合法标识符；离异关系默认 DIVORCED_FROM）
relation.spouse=MARRIED_TO
relation.divorce=DIVORCED_FROM

# ===== 写入行为 =====
# 每批写入 Neo4j 的记录数
write.batch_size=10000
# 关系端点人员不在图谱中时，是否创建仅含身份证号的最小 Person 节点
# true=创建（保证关系落地）；false=仅连接图谱中已存在的人员
graph.create_missing_nodes=true
